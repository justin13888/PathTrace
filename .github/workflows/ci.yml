name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  MISE_LOCKED: "1"
  MISE_RUSTUP_HOME: /home/runner/.local/share/mise/rustup
  MISE_CARGO_HOME: /home/runner/.local/share/mise/cargo
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - run: hk check --all
      - run: cargo deny check
      - name: Release target compiles (musl libc types differ from glibc)
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo clippy --locked --workspace --all-targets --target x86_64-unknown-linux-musl -- -D warnings
      - name: Conventional commits (PR commits)
        if: github.event_name == 'pull_request'
        run: convco check --ignore-reverts "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"
      - name: Conventional PR title (becomes the merge commit title)
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" | grep -qE '^[a-z]+\([a-z]+\)!?: .+' || { echo "PR title must be type(scope): description"; exit 1; }
          printf '%s\n' "$TITLE" | convco check --from-stdin --strip
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          key: audit
      - name: Requirement → evidence chain
        # Release mode (stale evidence fails) runs in release.yml, which gates publishing.
        run: cargo xtask audit
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Allow unprivileged user namespaces (Ubuntu 24.04 AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Load qdisc/netfilter modules (module autoload is unavailable inside user namespaces)
        run: |
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" >/dev/null 2>&1 || true
          sudo modprobe -a sch_netem sch_tbf sch_fq_codel sch_prio cls_u32 act_pedit nf_conntrack nft_masq nft_chain_nat || true
          lsmod | grep -E 'netem|tbf|pedit' || true
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.runner }}
      - run: cargo nextest run --workspace --locked --no-tests=pass
      - name: Network-namespace integration tests
        run: cargo nextest run --workspace --locked --run-ignored ignored-only --no-tests=pass
