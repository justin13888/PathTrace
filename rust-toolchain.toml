# The pinned stable toolchain is the MSRV. Nightly is used only for cargo-fuzz (see mise.toml).
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]
# Release binaries are static musl builds (release.yml); CI also checks this target on every PR.
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
