# Experiment definition. Committed before the run; never edited after the run.
id = "EXP-0003-r3"
title = "Independent Python reader and Rust reader agree on every conformance directory (incl. a real golden trace)"
hypothesis = """The spec-only Python reader accepts every valid file of every conformance directory with the Rust \
reader's content digest and rejects every invalid file for the expected reason; the Rust reader matches every \
expected.json and the JSON twin round-trips the valid synthetic files."""
command = "for d in conformance/*/; do python3 -I tools/ptf-py/ptf.py conformance \"$d\" || exit 1; done && cargo test --release --locked -q -p pt-format --test conformance"
covers = ["crates/pt-format/src", "tools/ptf-py", "conformance", "docs/design/ptf-format.md"]
requirements = ["REQ-FMT-001", "REQ-FMT-002", "REQ-FMT-003", "REQ-FMT-005", "REQ-FMT-009", "REQ-FMT-010", "REQ-FMT-013", "REQ-FMT-014", "REQ-FMT-018"]
supersedes = ["EXP-0003-r2"]
