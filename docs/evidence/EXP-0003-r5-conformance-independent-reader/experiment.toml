# Experiment definition. Committed before the run; never edited after the run.
id = "EXP-0003-r5"
title = "Independent Python reader and Rust reader agree on every conformance directory (incl. the v1.1 corpus and a real golden trace) (re-run after #39 to #51)"
hypothesis = """The spec-only Python reader accepts every valid file of every conformance directory (v1.0, v1.0-real \
and the new v1.1 corpus with the PTF 1.1 additions) with the Rust reader's content digest and rejects every \
invalid file for the expected reason; the Rust reader matches every expected.json and the JSON twin round-trips \
the valid synthetic files of v1.0 and v1.1."""
command = "for d in conformance/*/; do python3 -I tools/ptf-py/ptf.py conformance \"$d\" || exit 1; done && cargo test --release --locked -q -p pt-format --test conformance"
covers = ["crates/pt-format/src", "tools/ptf-py", "conformance", "docs/design/ptf-format.md"]
requirements = ["REQ-FMT-001", "REQ-FMT-002", "REQ-FMT-003", "REQ-FMT-005", "REQ-FMT-009", "REQ-FMT-010", "REQ-FMT-013", "REQ-FMT-014", "REQ-FMT-018"]
supersedes = ["EXP-0003-r4"]
