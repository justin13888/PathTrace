# Experiment definition. Committed before the run; never edited after the run.
id = "EXP-0008-r3"
title = "Release v1.1.0: published static binaries verified end to end"
hypothesis = """The v1.1.0 GitHub release is an annotated tag on a main merge commit and publishes static musl \
pathtrace archives for x86_64 and aarch64 plus SHA256SUMS. The checksums verify; each binary is statically linked \
for its architecture; each archive holds the binary, LICENSE, README.md and the systemd unit. The released x86_64 \
binary reports version 1.1.0, passes doctor (reporting kernel RX and TX stamps and running the 1.1 preflight checks: \
clock sync, power, CPU governor, NIC offloads), and completes a smoke session in the namespace harness whose trace is \
valid and records version 1.1.0, the tag's commit and a clean build. `cargo xtask audit --release` passes at the tag."""
command = "sh docs/evidence/EXP-0008-r3-release-artefacts/check.sh"
covers = [".github/workflows/release.yml"]
requirements = ["REQ-REPO-009"]
supersedes = ["EXP-0008-r2"]
