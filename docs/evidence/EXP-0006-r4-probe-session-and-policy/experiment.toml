# Experiment definition. Committed before the run; never edited after the run.
id = "EXP-0006-r4"
title = "Probe, wire, syscall and derive tests, end-to-end namespace session, unsafe and dependency policy"
hypothesis = """Unit tests of pt-sys, pt-wire, pt-probe and pt-derive pass (Noise IKpsk2 auth, replay rejection, \
anti-amplification bound, pairing and 0600 key refusal, metered auto-profile, tag verification, TLS pinning, TCP \
header auth, controller, recorder, Mahimahi round trip); the end-to-end netns session produces a complete trace \
with every raw table; `unsafe` appears only in pt-sys with every block documented (clippy -D warnings); \
cargo-deny passes."""
command = "cargo test --release --locked -q -p pt-sys -p pt-wire -p pt-probe -p pt-derive && mise exec -- cargo nextest run --release --locked -p pathtrace --run-ignored ignored-only && cargo clippy --workspace --all-targets --locked -q -- -D warnings && ! grep -rln --include='*.rs' 'unsafe' crates xtask bench | grep -v '^crates/pt-sys/' && mise exec -- cargo deny --log-level error check"
covers = ["crates/pt-sys/src", "crates/pt-wire/src", "crates/pt-probe/src", "crates/pt-derive/src", "crates/pathtrace", "tools/netns", "deny.toml"]
requirements = [
  "REQ-PRB-001", "REQ-PRB-002", "REQ-PRB-004", "REQ-PRB-006", "REQ-PRB-007", "REQ-PRB-008", "REQ-PRB-009",
  "REQ-PRB-012", "REQ-PRB-016", "REQ-PRB-017", "REQ-PRB-018", "REQ-PRB-024",
  "REQ-SEC-002", "REQ-SEC-003", "REQ-SEC-005", "REQ-SCOPE-007", "REQ-FMT-021",
]
supersedes = ["EXP-0006-r3"]
