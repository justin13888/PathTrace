# Spell-check configuration (typos). Add domain terms here, never disable files wholesale.
[default.extend-identifiers]
# PTF four-character section type codes.
INDX = "INDX"
CLOK = "CLOK"
OBSV = "OBSV"
SERS = "SERS"
PLCY = "PLCY"
EVNT = "EVNT"
VALD = "VALD"
CTXS = "CTXS"

[default.extend-words]
# MAC address fragment in research notes.
ba = "ba"
# Linux/networking identifier fragments.
ECT = "ECT"
controllen = "controllen"
reord = "reord"
rto = "rto"
# capacity_opps: delivery opportunities (PTF SERS table name).
opps = "opps"

[files]
extend-exclude = ["LICENSE", "mise.lock"]
