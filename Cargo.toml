[workspace]
resolver = "3"
members = ["bench/pt-bench", "crates/pt-derive", "crates/pt-format", "crates/pt-probe", "crates/pt-sys", "crates/pt-wire", "crates/pathtrace", "xtask"]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/justin13888/PathTrace"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[profile.release]
debug = "line-tables-only"
