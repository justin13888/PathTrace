[package]
name = "pt-sys"
description = "Linux system interface for PathTrace: sockets, kernel timestamps, cmsgs, TCP_INFO, clocks, netlink"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libc = "0.2.190"

# The only crate allowed to use `unsafe` (AGENTS.md, REQ-SEC-003). Every unsafe block must carry
# a `// SAFETY:` comment (clippy::undocumented_unsafe_blocks = deny).
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
